name: Sync Public Repository

on:
  push:
    branches:
      - master  # Триггер на пуши в ветку master

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # Шаг 1: Клонируем приватный репозиторий
      - name: Checkout private repo
        uses: actions/checkout@v3
        with:
          repository: triksterr/TecInterface
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}  # Используем PAT для доступа к приватному репозиторию
          path: private-repo

      # Шаг 2: Удаляем комментарии из C++ файлов и текстовые файлы во всех подпапках
      - name: Remove comments and text files
        run: |
          cd private-repo

          # Удаляем комментарии из C++ файлов во всех подпапках
          find . -type f \( -name "*.cpp" -o -name "*.h" \) | while read file; do
            sed '/\/\//d; /\/\*/,/\*\//d' "$file" > "${file}.tmp"
            mv "${file}.tmp" "$file"
          done

          # Удаляем все текстовые файлы во всех подпапках
          find . -type f \( -name "*.txt" -o -name "*.md" -o -name "TODO.c" \) -delete

      # Шаг 3: Клонируем публичный репозиторий
      - name: Checkout public repo
        uses: actions/checkout@v3
        with:
          repository: triksterr/QueueInterface
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}  # Используем PAT для доступа к публичному репозиторию
          path: public-repo

      # Шаг 4: Копируем очищенный код в публичный репозиторий
      - name: Copy cleaned code to public repo
        run: |
          cp -r private-repo/* public-repo/
          cd public-repo
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Auto-sync from private repo"
          git push origin main  # Убедитесь, что ветка указана правильно
